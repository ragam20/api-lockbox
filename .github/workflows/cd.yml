name: CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - run: go test ./...

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          cd "$HOME/deploy/lockbox/api-lockbox"

          git fetch origin
          git reset --hard origin/main

          docker compose -f "$HOME/deploy/lockbox/app" up -d --build
