name: CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - run: go test ./...

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          $HOME/deploy/lockbox/app/deploy.sh
