name: lockbox-dev

services:
  database:
    image: postgres:16-alpine
    container_name: lockbox-postgres-dev
    restart: no
    environment:
      POSTGRES_DB: lockbox_dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: UTC

    ports:
      - "5432:5432"
    volumes:
      - lockbox-postgres-dev-data:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lockbox_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lockbox-redis-dev
    restart: no
    ports:
      - "6379:6379"
    volumes:
      - lockbox-redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  lockbox-postgres-dev-data:
  lockbox-redis-dev-data:
